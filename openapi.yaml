openapi: 3.0.3

info:
  title: AI Agent API
  description: REST API for Web and Telegram clients.
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: Sessions
    description: Agent session management
  - name: Messages
    description: Interaction with the AI agent

paths:
  /sessions:
    post:
      tags:
        - Sessions
      summary: Create a new session
      operationId: createSession
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

    get:
      tags:
        - Sessions
      summary: Get list of sessions
      operationId: getSessions
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'

  /sessions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'

    get:
      tags:
        - Messages
      summary: Get session message history
      operationId: getMessages
      responses:
        '200':
          description: List of messages in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Messages
      summary: Send a message to the agent
      description: >
        Executes the agent loop and returns the final
        assistant response after execution is completed.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Agent is already running in this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Agent execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Unique session identifier
      schema:
        type: string
        format: uuid

  schemas:
    Session:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: May be some id or uuid idk

    Message:
      type: object
      required:
        - id
        - role
        - content
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
          example: Hello! How can I help you?
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          example: Find a power bank on Ozon

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Session not found
